server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://reservation-db:5432/reservation
    username: reservation
    password: reservation
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Shared secret used for signing and verifying JWTs. Provided via environment variable.
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:mysecretkeymysecretkeymysecretkey}

# Base URL of the scheduling-service used for inter-service calls. Overridden via environment
# variables in containerised environments.
scheduling:
  service:
    base-url: http://scheduling-service:8080